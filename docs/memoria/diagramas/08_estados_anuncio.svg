<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<defs>
<marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
</marker>
</defs>
<rect width="800" height="600" fill="#ffffff"/>
<text x="400" y="30" font-family="Calibri,Arial,sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Diagrama de estados de un anuncio</text>
<rect x="80" y="120" width="120" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="150.0" font-family="Calibri,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Borrador</text><line x1="200" y1="145" x2="280" y2="145" stroke="#333333" stroke-width="1.2" marker-end="url(#arrowhead)"/><rect x="280" y="120" width="120" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="340.0" y="150.0" font-family="Calibri,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Pendiente</text><line x1="400" y1="145" x2="480" y2="145" stroke="#333333" stroke-width="1.2" marker-end="url(#arrowhead)"/><rect x="480" y="120" width="120" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="540.0" y="150.0" font-family="Calibri,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Aprobado</text><line x1="540" y1="175" x2="540" y2="260" stroke="#333333" stroke-width="1.2" marker-end="url(#arrowhead)"/><rect x="480" y="260" width="120" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="540.0" y="290.0" font-family="Calibri,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Rechazado</text><rect x="280" y="260" width="120" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="340.0" y="290.0" font-family="Calibri,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#000000">Reportado</text><line x1="400" y1="285" x2="480" y2="285" stroke="#333333" stroke-width="1.2" marker-end="url(#arrowhead)"/></svg>