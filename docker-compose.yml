services:
  mysql:
    image: mysql:8.0
    container_name: citypaj-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: citypaj
      MYSQL_USER: citypaj_user
      MYSQL_PASSWORD: citypaj123
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_ALLOW_EMPTY_ROOT_PASSWORD: "no"
    volumes:
      - citypaj_mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  citypaj_mysql_data:
    driver: local
