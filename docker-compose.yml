services:
  mysql:
    image: mysql:8.0
    container_name: citypaj-mysql
    environment:
      MYSQL_DATABASE: citypaj
      MYSQL_USER: citypaj_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CityPajUser2025!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CityPajRoot2025!}
      MYSQL_ALLOW_EMPTY_ROOT_PASSWORD: "no"
    volumes:
      - citypaj_mysql_data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
      - ./citypaj_dump.sql:/docker-entrypoint-initdb.d/999_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: production
    container_name: citypaj-backend
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: citypaj
      DB_USER: citypaj_user
      DB_PASSWORD: ${MYSQL_PASSWORD:-CityPajUser2025!}
      JWT_SECRET: ${JWT_SECRET:-cambia-esta-clave-en-produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambia-esta-clave-refresh-en-produccion}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: citypaj-frontend
    ports:
      - "3001:3001"
    environment:
      BACKEND_URL: http://backend:3002
      NEXT_PUBLIC_API_URL: http://localhost:3002
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  citypaj_mysql_data:
    driver: local
